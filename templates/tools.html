<section id="tools" class="w-11/12 ml-auto mr-auto mb-20">
    <div class="p-5 flex flex-wrap justify-center">
        <h2 class="text-6xl mb-10"> Languages, Frameworks, and Other Tools </h2>
        <p class="text-xl"> A list of the tools, frameworks, and programming languages I have used and learned in the past.</p>
        <div class="flex flex-wrap object-center justify-center w-screen">
            <div class="terminal-style w-1/2 h-64 bg-black p-8 flex border-solid border-slate-500 border-8 my-16 relative -z-10">
                <div class="text-lime-600 relative top-val -left-4 flex flex-col w-2 h-15"> 1 2 3 4 5 6 </div>
                <div class="text-lime-600 absolute -top-1 left-14 z-20 font-medium"> //Hello World </div>       
                <div class="absolute left-14">
                    <div id="typing-window" class="inline text-white whitespace-pre"></div>
                </div>
            </div>
            <ul class="flex flex-wrap mb-10 w-full"> 
                {% for tool in items %}
                <li class="w-80 mx-1 my-3"> {{tool}} </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</section>
