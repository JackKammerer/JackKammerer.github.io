<section id="school" class="bg-gray-800 shadow-md rounded-lg p-6 mb-8">
    <div>
        <h1 class="text-2xl font-bold mb-4">School Experience</h1>
        <ul class="space-y-6">
            {% for school in schools %}
            <li id="{{school.id}}" class="border-b pb-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
                    <label class="block">
                        <p class="text-l underline">School Name:</p>
                        <input type="text" class="textUpdate school_name mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{school.school_name}}">
                    </label>
                    <label class="block">
                        <p class="text-l underline">Date Range:</p>
                        <input type="text" class="textUpdate school_dates mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{school.school_dates}}">
                    </label>
                </div>
                <label class="block mb-2">
                    <p class="text-l underline">Degree:</p>
                    <input type="text" class="textUpdate degree mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{school.degree}}">
                </label>
                <p class="mb-2 underline">Accomplishments:</p>
                <ul class="awards space-y-2 mb-2">
                    {% for award in school.awards %}
                    <li class="flex items-center space-x-2"> 
                        <label class="flex w-full">
                            <p class="text-l mr-5">Award:</p>
                            <input type="text" class="updateListText block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{award}}">
                        </label>
                        <button class="updateListDelete bg-red-800 hover:bg-red-500 text-white font-bold py-1 px-2 rounded">Delete</button>
                    </li>
                    {% endfor %}
                </ul>
                <button class="updateListAdd bg-blue-600 hover:bg-blue-400 text-white font-bold py-2 px-4 rounded mr-2">Add Award</button>
                <button class="deleteObject bg-red-800 hover:bg-red-500 text-white font-bold py-2 px-4 rounded">Delete School</button>
            </li>
            {% endfor %}
        </ul>
        <button class="createObject bg-blue-900 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4">Add School</button>
    </div>
</section>
