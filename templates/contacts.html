<section id="contact" class="secondary-back w-full">
    <div class="p-5">
        <h2 class="titleClass"> Contact Information </h2>
        <p class="text-xl -mt-10 mb-10"> Feel free to contact me or view my work and activities on any of the links below! </p>
        <ul class="flex flex-wrap justify-center"> 
            {% for item in contacts %}
            <div class="flex flex-wrap relative w-1/6 m-5 justify-center contact-class">
                <span class="absolute z-20 mx-auto bg-sky-300 text-slate-600 p-2 rounded-3xl pointer-events-none before:content-[''] before:w-5 before:h-5 before:transform before:rotate-45 before:absolute before:-bottom-2 before:right-1/2 before:-z-10 before:bg-sky-300 opacity-0"> {{item.contact_name}} </span>
                <a class="flex relative w-full h-16 p-2 rounded-xl justify-center border-solid border-slate-600 border-4 contact-button hover:border-sky-300 after:bg-blue-700 after:w-full after:h-24 after:text-white after:absolute after:top-0 after:left-0 after:content-[''] after:transition-all duration-125 after:translate-y-full after:hover:translate-y-0 after:flex after:justify-center after:object-center after:py-4 after:z-10 overflow-hidden" href={{item.link_name}}>
                    <img class="h-full z-20" src={{item.image_name}} alt=""/>
                </a>
            </div>
            {% endfor %}
        </ul>
    </div>
</section>
