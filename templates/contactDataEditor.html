<section id="contacts" class="bg-gray-800 shadow-md rounded-lg p-6 mb-8">
    <div>
        <h2 class="text-xl font-bold mb-4">Contact Information</h2>
        <ul class="space-y-4"> 
            {% for item in contacts %}
            <div id="{{ item.id }}">
                <label class="block mb-2">
                    <p class="text-l underline">Contact Name:</p>
                    <input type="text" class="textUpdate contact_name mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{item.contact_name}}">
                </label>
                <label class="block mb-2">
                    <p class="text-l underline">Link:</p>
                    <input type="text" class="textUpdate link_name mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{item.link_name}}">
                </label>
                <label class="block mb-2">
                    <p class="text-l underline">Image Path:</p>
                    <input type="text" class="textUpdate image_name mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-gray-500 p-1" value="{{item.image_name}}" alt="">
                </label>
                <button class="deleteObject bg-red-800 hover:bg-red-500 text-white font-bold py-2 px-4 rounded">Delete</button>
            </div>
            {% endfor %}
        </ul>
        <button class="createObject bg-blue-900 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4">Add Contact</button>
    </div>
</section>
