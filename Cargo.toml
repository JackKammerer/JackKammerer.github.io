[package]
name = "PersonalWebsiteBackend"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8.4"
anyhow = "1.0.86"
askama = "0.12.1"
axum = { version="0.7.5", features=["macros", "form"] }
base64-url = "3.0.0"
cbc = "0.1.2"
chrono = "0.4.38"
dotenv = "0.15.0"
hex-literal = "0.4.1"
hmac = "0.12.1"
html-escape = "0.2.13"
postgres = "0.19.7"
rand = "0.8.5"
rand_chacha = "0.3.1"
reqwest = { version="0.12.5", features=["json"] }
rsa = "0.9.6"
serde = { version="1.0.203", features=["derive"] }
serde_json = "1.0.118"
sha2 = "0.10.8"
sqlx = { version = "0.7.4", features = ["runtime-async-std-native-tls", "postgres", "chrono", "uuid"] }
tokio = { version = "1.38.0", features = ["rt-multi-thread"] }
tower = { version="0.4.13", features=["util", "timeout", "limit"] }
tower-http = { version="0.5.1", features=["add-extension", "fs", "validate-request", "cors", "compression-gzip", "trace"] }
tracing-subscriber = "0.3.18"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
