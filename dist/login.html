<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" type="image/svg+xml" href="/dist/favicon.ico" />
        <title>Login</title>
    </head>
    <body>
        <a id="return-button" href="/">Back to Home</a>
        <div class="login-container">
            <label for="username" class="input-label"> Username </label>
            <input type="text" name="username" id="username" class="input-field">

            <label for="password" class="input-label">Password</label> 
            <input type="password" id="password" class="input-field"> 

            <button onclick="getjwe()" id="submit-button"> Submit! </button>
        </div>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #000000;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .login-container {
                background-color: rgb(104, 104, 107);
                padding: 2rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 300px;
            }

            .input-label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: bold;
            }

            .input-field {
                width: 100%;
                padding: 0.5rem;
                margin-bottom: 1rem;
                border: 1px solid #2c2c2c;
                border-radius: 4px;
            }

            #submit-button {
                width: 100%;
                padding: 0.75rem;
                background-color: #052375;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 1rem;
                transition: background-color 0.3s ease;
            }

            #submit-button:hover {
                background-color: #1377e2;
            }

            #return-button {
                position: absolute;
                top: 20px;
                left: 20px;
                padding: 10px 15px;
                background-color: #052375;
                color: #ffffff;
                text-decoration: none;
                border-radius: 4px;
                border: 1px solid #ffffff;
                font-size: 14px;
                transition: all 0.3s ease;
            }

            #return-button:hover {
                background-color: #1377e2;
                color: white;
            }
        </style>

        <script>
            async function getjwe() {
                let username = document.getElementById("username").value;
                let password = document.getElementById("password").value;
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";

                await fetch("/getjwe", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ username: username, password:password })
                }).then(response => {
                    if (response.ok) {
                        localStorage.setItem("X-XSRF-TOKEN", response.headers.get("X-XSRF-TOKEN"));
                    }
                })

                window.location.href = "/private/admin"
            }
        </script>
    </body>
</html>
